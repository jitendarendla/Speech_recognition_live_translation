<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Live Hindi / Telugu to English Translator</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f2f4f8;
            padding: 40px;
        }
        h2 {
            color: #333;
        }
        button {
            padding: 12px 24px;
            font-size: 16px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            margin-right: 10px;
        }
        #start {
            background-color: #28a745;
            color: white;
        }
        #stop {
            background-color: #dc3545;
            color: white;
        }
        .box {
            margin-top: 20px;
            background: white;
            padding: 15px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        .label {
            font-weight: bold;
            margin-bottom: 8px;
        }
        #status {
            margin-top: 15px;
            font-weight: bold;
            color: #007bff;
        }
    </style>
</head>

<body>

<h2>🎤 Live Speech Translation (Hindi / Telugu → English)</h2>
<p>Click Start, speak clearly, then Stop to translate.</p>

<button id="start">🎙 Start Speaking</button>
<button id="stop" disabled>⛔ Stop & Translate</button>

<div id="status">Idle</div>

<div class="box">
    <div class="label">🟡 Original (Hindi / Telugu)</div>
    <div id="original">---</div>
</div>

<div class="box">
    <div class="label">🟢 English Translation</div>
    <div id="english">---</div>
</div>

<script>
let recorder;
let audioChunks = [];

const startBtn = document.getElementById("start");
const stopBtn = document.getElementById("stop");
const statusText = document.getElementById("status");

startBtn.onclick = async () => {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    audioChunks = [];

    recorder.ondataavailable = e => audioChunks.push(e.data);

    recorder.start();
    statusText.innerText = "Recording...";
    startBtn.disabled = true;
    stopBtn.disabled = false;
};

stopBtn.onclick = async () => {
    recorder.stop();
    statusText.innerText = "Processing...";
    stopBtn.disabled = true;

    recorder.onstop = async () => {
        try {
            const blob = new Blob(audioChunks, { type: "audio/webm" });
            const arrayBuffer = await blob.arrayBuffer();
            const audioCtx = new AudioContext();
            const audioBuffer = await audioCtx.decodeAudioData(arrayBuffer);

            const wavBlob = convertToWav(audioBuffer);

            const formData = new FormData();
            formData.append("file", wavBlob, "speech.wav");

            const response = await fetch("http://127.0.0.1:8000/translate", {
                method: "POST",
                body: formData
            });

            const result = await response.json();
            console.log("API response:", result); // 🔍 DEBUG

            if (result.error) {
                statusText.innerText = "API Error";
                alert(result.error);
                return;
            }

            document.getElementById("original").innerText =
                result.original_text || "(no text detected)";

            document.getElementById("english").innerText =
                result.english_translation || "(no translation)";

            statusText.innerText = "Translation Complete";
            startBtn.disabled = false;

        } catch (err) {
            console.error(err);
            statusText.innerText = "Error occurred";
            alert("Frontend error: " + err.message);
        }
    };
};

// WAV CONVERTER (UNCHANGED)
function convertToWav(buffer) {
    const numChannels = buffer.numberOfChannels;
    const length = buffer.length * numChannels * 2 + 44;
    const array = new ArrayBuffer(length);
    const view = new DataView(array);
    let offset = 0;

    function writeString(s) {
        for (let i = 0; i < s.length; i++)
            view.setUint8(offset++, s.charCodeAt(i));
    }

    writeString("RIFF");
    view.setUint32(offset, length - 8, true); offset += 4;
    writeString("WAVEfmt ");
    view.setUint32(offset, 16, true); offset += 4;
    view.setUint16(offset, 1, true); offset += 2;
    view.setUint16(offset, numChannels, true); offset += 2;
    view.setUint32(offset, buffer.sampleRate, true); offset += 4;
    view.setUint32(offset, buffer.sampleRate * 2 * numChannels, true); offset += 4;
    view.setUint16(offset, numChannels * 2, true); offset += 2;
    view.setUint16(offset, 16, true); offset += 2;
    writeString("data");
    view.setUint32(offset, length - offset - 4, true); offset += 4;

    const channels = [];
    for (let i = 0; i < numChannels; i++)
        channels.push(buffer.getChannelData(i));

    let i = 0;
    while (offset < length) {
        for (let c = 0; c < numChannels; c++) {
            let sample = Math.max(-1, Math.min(1, channels[c][i]));
            view.setInt16(offset, sample < 0 ? sample * 0x8000 : sample * 0x7fff, true);
            offset += 2;
        }
        i++;
    }
    return new Blob([view], { type: "audio/wav" });
}
</script>

</body>
</html>
